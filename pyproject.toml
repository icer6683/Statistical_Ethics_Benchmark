[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigpilot"
version = "0.1.0"
description = "Pilot study: does an LLM endorse an unsupported efficacy claim selected from 20 tested outcomes?"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "tabulate>=0.9",
    "anthropic>=0.116",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sigpilot = "sigpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
